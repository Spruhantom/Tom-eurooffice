name: Shell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Bash syntax
        run: bash -n install.sh uninstall.sh tests/container-smoke.sh scripts/configure-opencloud.sh tests/opencloud-config.sh tests/opencloud-live-smoke.sh
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh uninstall.sh tests/container-smoke.sh scripts/configure-opencloud.sh tests/opencloud-config.sh tests/opencloud-live-smoke.sh
      - name: OpenCloud integration configuration test
        run: bash tests/opencloud-config.sh
